[project]
name = "sklearn-master-script"
version = "1.0.0"
description = "Guia de consulta de scikit-learn: pipelines e grades de hiperparametros para classificacao, regressao e clusterizacao"
readme = "README.md"
requires-python = ">=3.12"

# ---------------------------------------------------------------------------
# Nucleo: tudo que os tres notebooks importam no topo.
# ---------------------------------------------------------------------------
dependencies = [
    # --- Base numerica e de dados ---
    # Teto <2.5 vem do numba, dependencia do shap e do umap-learn (extras
    # "explain" e "cluster"). numpy 2.4 x 2.5 e indiferente para este projeto,
    # entao vale mais manter os extras instalaveis. Se voce nao usa shap nem
    # umap, pode remover o teto e subir para o numpy mais recente.
    "numpy>=1.26,<2.5",
    "pandas>=2.2",             # groupby.apply(include_groups=) usado no nb 02
    "scipy>=1.13",             # loguniform / uniform / randint das grades
    "pyarrow>=16.0",           # leitura e escrita de .parquet

    # --- scikit-learn ---
    # >=1.6 garante: HDBSCAN, root_mean_squared_error, TargetEncoder,
    # PredictionErrorDisplay, class_weight no HistGradientBoosting e set_output.
    "scikit-learn>=1.6",
    "joblib>=1.4",

    # --- Graficos ---
    "matplotlib>=3.10",        # orientation= no boxplot; vert= sai no 3.13

    # --- Boosting externo (mesma API do sklearn, entra nos Pipelines) ---
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "catboost>=1.2.7",

    # --- Desbalanceamento (SMOTE e o Pipeline proprio) — nb 01 ---
    "imbalanced-learn>=0.13",
]

# ---------------------------------------------------------------------------
# Opcionais: instale so quando precisar. Ver INSTALACAO.md.
#   uv sync --extra explain
#   uv sync --all-extras
# ---------------------------------------------------------------------------
[project.optional-dependencies]

# Interpretabilidade (celulas 6.6 do nb 01 e 6.5 do nb 02)
explain = [
    "shap>=0.46",
]

# Busca bayesiana de hiperparametros (celulas 5.5)
tuning = [
    "optuna>=4.0",
]

# Clusterizacao avancada (nb 03)
cluster = [
    "kneed>=0.8.5",            # deteccao automatica do cotovelo
    "kmodes>=0.12",            # KModes / KPrototypes para dados categoricos
    "umap-learn>=0.5.6",       # projecao nao-linear, alternativa ao t-SNE
]

# Leitura de outras fontes de dados
io = [
    "openpyxl>=3.1",           # pd.read_excel
    "sqlalchemy>=2.0",         # pd.read_sql
]

# ---------------------------------------------------------------------------
# Ambiente de trabalho: instalado por padrao no `uv sync`.
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",         # barras de progresso e widgets

    # --- Testes (ver tests/ e .github/workflows/ci.yml) ---
    "pytest>=8.3",
    "nbformat>=5.10",          # leitura dos .ipynb
    "nbclient>=0.10",          # execucao de ponta a ponta em tests/test_execucao.py
    "nbstripout>=0.8",         # hook que mantem as saidas fora do Git
    "pre-commit>=3.8",         # instala o hook: uv run pre-commit install
]

[tool.uv]
# Mantem os notebooks fora do build: este projeto nao e um pacote instalavel.
package = false

# ---------------------------------------------------------------------------
# Testes. Por padrao rodam so os estaticos (segundos). Os que executam os
# notebooks inteiros ficam atras do marcador `lento`:
#   uv run pytest                                  -> estaticos
#   MASTER_SCRIPT_FAST=1 uv run pytest -m lento    -> os tres notebooks
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lento: executa os notebooks de ponta a ponta (minutos)"]
addopts = "-m 'not lento' --strict-markers"

